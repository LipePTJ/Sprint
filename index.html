<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex API Sprint</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="container">
    <header>
      <h1>Pokédex</h1>
      <p>Busque seu Pokémon favorito</p>
    </header>


    <section class="search-area">
      <input type="text" id="pokemonInput" placeholder="Ex: charizard ou 6" autocomplete="off">
      <button id="searchBtn">Buscar</button>
    </section>

  
    <div id="errorMsg" class="error-message hidden"></div>


    <section id="pokemonCard" class="card hidden">
      <div class="card-header">
        <span id="pokemonId" class="poke-id"></span>
        <h2 id="pokemonName" class="poke-name"></h2>
      </div>
      
      <div class="image-container">
        
        <img id="pokemonImage" src="" alt="Imagem do Pokémon">
      </div>

     
      <div id="pokemonTypes" class="types-container"></div>
      
     
      <div class="poke-info">
        <p><strong>Peso:</strong> <span id="pokemonWeight"></span> kg</p>
        <p><strong>Altura:</strong> <span id="pokemonHeight"></span> m</p>
      </div>
    </section>

  </main>

  
  <script src="js/script.js"></script>
</body>
</html>
